{% if request.user.base_group == 'trade' %}
<div id="tradePaymentPanel" class="border-top pt-3 mt-3" dir="rtl">
    {% csrf_token %}
    <div class="d-flex flex-wrap align-items-center gap-1" role="group" aria-label="فیلترهای پرداخت">
        <span class="fw-bold me-2">وضعیت پرداخت</span>
        <button type="button" class="btn btn-sm btn-bordered btn-outline-primary mx-1" data-payment-mode="scheduled" aria-pressed="false" disabled>پرداخت برنامه‌ریزی شده</button>
        <button type="button" class="btn btn-sm btn-bordered btn-outline-primary mx-1" data-payment-mode="overdue" aria-pressed="false" disabled>پرداخت منقضی شده</button>
        <button type="button" class="btn btn-sm btn-bordered btn-outline-primary mx-1" data-payment-mode="today" aria-pressed="false" disabled>پرداخت سررسید امروز</button>
        <button type="button" class="btn btn-sm btn-bordered btn-outline-primary mx-1" data-payment-mode="due_until" aria-pressed="false" disabled>پرداخت تا سررسید یک تاریخ خاص</button>
        <button type="button" class="btn btn-sm btn-bordered btn-outline-primary mx-1" data-payment-mode="date_range" aria-pressed="false" disabled>پرداخت در بازه زمانی خاص</button>
        <button type="button" id="tradePaymentClear" class="btn btn-sm btn-outline-secondary mx-1 d-none" disabled>حذف فیلتر پرداخت</button>
    </div>
    <div id="tradePaymentDateControls" class="d-none mt-3">
        <div class="d-flex flex-wrap align-items-end gap-2">
            <div>
                <label class="form-label mb-1">نوع تقویم</label>
                <div class="btn-group d-flex" role="group" aria-label="نوع تقویم">
                    <button type="button" class="btn btn-sm btn-outline-primary" data-payment-calendar="gregorian" aria-pressed="true">میلادی</button>
                    <button type="button" class="btn btn-sm btn-outline-primary" data-payment-calendar="jalali" aria-pressed="false">شمسی</button>
                </div>
            </div>
            <div id="tradePaymentStartWrap" class="d-none tp-date-field">
                <label for="tradePaymentStart" class="form-label mb-1">از تاریخ</label>
                <input id="tradePaymentStart" type="date" class="form-control form-control-sm" dir="ltr" min="1821-03-21" max="2221-03-20">
                <button type="button" id="tradePaymentStartJalali" class="btn btn-sm btn-outline-secondary tp-jalali-display d-none" aria-label="انتخاب تاریخ شروع شمسی" aria-haspopup="dialog" aria-expanded="false"></button>
                <small id="tradePaymentStartEquivalent" class="text-muted d-block tp-date-equivalent" dir="ltr"></small>
            </div>
            <div id="tradePaymentEndWrap" class="tp-date-field">
                <label for="tradePaymentEnd" class="form-label mb-1">تا تاریخ</label>
                <input id="tradePaymentEnd" type="date" class="form-control form-control-sm" dir="ltr" min="1821-03-21" max="2221-03-20">
                <button type="button" id="tradePaymentEndJalali" class="btn btn-sm btn-outline-secondary tp-jalali-display d-none" aria-label="انتخاب تاریخ پایان شمسی" aria-haspopup="dialog" aria-expanded="false"></button>
                <small id="tradePaymentEndEquivalent" class="text-muted d-block tp-date-equivalent" dir="ltr"></small>
            </div>
            <div class="tp-date-actions"><button type="button" id="tradePaymentApply" class="btn btn-sm btn-primary" disabled>تایید</button></div>
        </div>
    </div>
    <div id="tradePaymentFilterHelp" class="text-muted small mt-2" aria-live="polite"></div>
    <div id="tradePaymentFilterError" class="text-danger small mt-1" role="alert"></div>
</div>
{% endif %}
