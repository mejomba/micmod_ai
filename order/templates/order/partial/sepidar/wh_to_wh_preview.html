<table class="table table-bordered table-responsive table-hover table-striped">
    <thead class="table-light">
        <tr>
            <th scope="col" class="text-center">#</th>
            <th scope="col" class="text-center">کالا</th>
            <th scope="col" class="text-center">تعداد در پکینگ</th>
            <th scope="col" class="text-center">تعداد دریافت شده در انبار</th>
        </tr>
    </thead>
    <tbody>
    {% for packing_item in packing_items %}
        <tr>
            <td>{{ forloop.counter }}</td>
            <td>{{ packing_item.order.item.part_number }}</td>
            <td>{{ packing_item.quantity }}</td>
            <td>
                {{ packing_item.wh_receipt_quantity }}
            </td>
        </tr>
    {% endfor %}

    </tbody>
</table>





<a class="btn btn-sm btn-primary" href="{% url 'order:quick_packing' packing.pk %}">
    باز کردن پکینگ جدید برای پیش‌نمایش و ارسال به سپیدار
</a>
