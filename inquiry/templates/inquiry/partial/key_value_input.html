<div id="{{ id }}" class="">

    <div id="id_variants_json_container">
        <div class="d-flex ">
            <span>عنوان</span>
            <span class="mx-auto">مقدار</span>
        </div>
        <div class="d-flex align-items-center variants_json gap-1">
            <input type="text" name="key__variant_json" class="form-control py-1 px-2" onkeydown="return false;">
            <input type="text" name="val" class="me-2 form-control py-1 px-2">
            <i class="ki-duotone ki-cross-circle text-danger fs-1 cursor-pointer scale-1-3" onclick="remove_variants_json(event)">
                <span class="path1"></span>
                <span class="path2"></span>
            </i>
        </div>
    </div>

    <div class="float-end">
        <i class="ki-duotone ki-plus-circle text-primary fs-1 cursor-pointer scale-1-3" onclick="add_variants_json(event)">
             <span class="path1"></span>
             <span class="path2"></span>
        </i>
    </div>

</div>

<script>
    function remove_variants_json(event){
        event.currentTarget.parentElement.remove()
    }

    function add_variants_json(event){
        const element = `

            <input type="text" name="key__variant_json" class="form-control py-1 px-2" onkeydown="return false;">
            <input type="text" name="val" class="me-2 form-control py-1 px-2">
            <i class="ki-duotone ki-cross-circle text-danger fs-1 cursor-pointer scale-1-3" onclick="remove_variants_json(event)">
                <span class="path1"></span>
                <span class="path2"></span>
            </i>

`
        const variantsJsonContainer = document.querySelector('#id_variants_json_container')
        if (variantsJsonContainer){
            const container = document.createElement('div')
            container.className = "d-flex align-items-center variants_json gap-1"
            container.innerHTML = element
            variantsJsonContainer.append(container)
        }
    }
</script>
