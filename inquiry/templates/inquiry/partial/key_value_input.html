<script>
    function generateUUID() {
        return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
            const r = (Math.random() * 16) | 0;
            const v = c === 'x' ? r : (r & 0x3) | 0x8;
            return v.toString(16);
        });
    }
    function remove_variants_json(event){
        event.currentTarget.parentElement.remove()
    }

    function add_variants_json(event){
        const uuid = generateUUID()
        const element = `
            <input type="text" name="key__variant_json" list="list_variant__${uuid}" class="form-control py-1 px-2" onkeydown="return false;">
            <input type="text" name="val__variant_json" class="me-2 form-control py-1 px-2" onchange="to_json(this)">
            <i class="ki-duotone ki-cross-circle text-danger fs-1 cursor-pointer scale-1-3" onclick="remove_variants_json(event); to_json()">
                <span class="path1"></span>
                <span class="path2"></span>
            </i>
`
        const variantsJsonContainer = document.querySelector('#id_variants_json_container')
        if (variantsJsonContainer){
            const container = document.createElement('div')
            container.className = "d-flex align-items-center variants_json gap-1"
            container.innerHTML = element
            variantsJsonContainer.append(container)
        }
        get_variant_title(uuid)
    }

    const insertAfter = (element, htmlString) => element.insertAdjacentHTML("afterend", htmlString)

    function get_variant_title(uuid){
        $.ajax({
        type: 'GET',
        url: '/inquiry/variant/title/',
        dataType: 'json',
        cache: false,
        processData: false,
        contentType: false,
        beforeSend: block_main_container,
        success: function (data) {
            if (data){
                let html = `
                <datalist id="list_variant__${uuid}">`
                for (const d in data) {
                    html += `<option>${d}</option>`
                }
                html += `</datalist>`
                const item = document.querySelector(`input[list="list_variant__${uuid}"]`)
                insertAfter(item, html)
            }
        },
        error: function () {

        },
        complete: release_main_container
    });
    }

    function to_json() {
        const variant_jsons = document.querySelectorAll('.variants_json')
        const real_variant_jsons = document.querySelector("textarea[name='variants_json']")
        const jsonObj = {}
        variant_jsons && variant_jsons.forEach(function (item) {
            const key = item.querySelector('input[name="key__variant_json"]').value
            const val = item.querySelector('input[name="val__variant_json"]').value
            jsonObj[key] = val
        })
        if (jsonObj && real_variant_jsons) {
            real_variant_jsons.value = JSON.stringify(jsonObj)
        }
    }
</script>
