<div id="{{ id }}">

    <div id="id_list_json_container">
        <div class="d-flex d-none" id="id_list_json_title">
            <span class="mx-auto">مقدار</span>
        </div>
    </div>

    <div class="float-end">
        روش های حمل
        <i class="ki-duotone ki-plus-circle text-primary fs-1 cursor-pointer scale-1-3" onclick="add_list_json(event)">
             <span class="path1"></span>
             <span class="path2"></span>
        </i>
    </div>

</div>

<script>
    function generateUUID() {
        return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
            const r = (Math.random() * 16) | 0;
            const v = c === 'x' ? r : (r & 0x3) | 0x8;
            return v.toString(16);
        });
    }

    function remove_variants_json(event){
        event.currentTarget.parentElement.remove()
    }

    function add_list_json(event){
        debugger
        const list_json_title = document.querySelector('#id_list_json_title')
        if (list_json_title){list_json_title.classList.remove('d-none')}
        const uuid = generateUUID()
        const element = `
            <input type="text" name="val__trade_transportation_method_json" list="list_transportation_method__${uuid}" class="form-control py-1 px-2" onchange="list_to_json(this)" onkeydown="return false;">
            <i class="ki-duotone ki-cross-circle text-danger fs-1 cursor-pointer scale-1-3" onclick="remove_variants_json(event); list_to_json()">
                <span class="path1"></span>
                <span class="path2"></span>
            </i>
`
        const variantsJsonContainer = document.querySelector('#id_list_json_container')
        if (variantsJsonContainer){
            const container = document.createElement('div')
            container.className = "d-flex align-items-center list_json gap-1"
            container.innerHTML = element
            variantsJsonContainer.append(container)
            get_transportation_title(uuid, container)
        }

    }

    function get_transportation_title(uuid){
        $.ajax({
        type: 'GET',
        url: '/inquiry/transportation_method/title/',
        dataType: 'json',
        cache: false,
        processData: false,
        contentType: false,
        //beforeSend: block_main_container,
        success: function (data) {
            debugger
            if (data){
                let html = `
                <datalist id="list_transportation_method__${uuid}">`
                for (const d in data) {
                    html += `<option data-pk="${data[d][0]}">${data[d][1]}</option>`
                }
                html += `</datalist>`
                const item = document.querySelector(`input[list="list_transportation_method__${uuid}"]`)
                insertAfter(item, html)
            }
        },
        error: function () {
            console.log('error .....')
        },
        //complete: release_main_container
    });
    }

    function list_to_json() {
        {#const datalistId = input.getAttribute('list');#}
        let list_array = []
        const variant_jsons = document.querySelectorAll('.list_json')
        const real_list_jsons = document.querySelector("textarea[name='trade_transportation_method_json']")
        let jsonObj = {};


        variant_jsons && variant_jsons.forEach(function (item) {
            const title = item.querySelector('input').value
            item.querySelectorAll('option').forEach(function (op){
                debugger
                if (op.value === title){
                    {#list_array.push(parseInt(op.dataset.pk))#}
                    jsonObj[title] = parseInt(op.dataset.pk)
                }
            })
        })
        {#const jsonObj = {'trade_transportation_method_json': list_array}#}

        if (jsonObj && real_list_jsons) {
            if (Object.keys(jsonObj).length === 0){
                real_list_jsons.value = null
            } else {
                real_list_jsons.value = JSON.stringify(jsonObj)
            }
        }
    }

    function show_transportation_title(){
        let uuid;
        const element = `
            <input type="text" name="val__trade_transportation_method_json" list="list_transportation_method__${uuid}" class="form-control py-1 px-2" onchange="list_to_json(this)" onkeydown="return false;" value="xxx">
            <i class="ki-duotone ki-cross-circle text-danger fs-1 cursor-pointer scale-1-3" onclick="remove_variants_json(event); list_to_json()">
               <span class="path1"></span>
               <span class="path2"></span>
            </i>`



        const trade_transportation_method_json = document.querySelector('#id_trade_transportation_method_json').value
        const variantsJsonContainer = document.querySelector('#id_list_json_container')
        variantsJsonContainer.innerHTML = ''
        let container;
        let ttmj = JSON.parse(trade_transportation_method_json)

        for (const d in ttmj) {
            debugger
            uuid = generateUUID()
            if (variantsJsonContainer){
                container = document.createElement('div')
                container.className = "d-flex align-items-center list_json gap-1"
                container.innerHTML = `
                                    <input type="text" name="val__trade_transportation_method_json" list="list_transportation_method__${uuid}" class="form-control py-1 px-2" onchange="list_to_json(this)" onkeydown="return false;" value="${d}">
                                    <i class="ki-duotone ki-cross-circle text-danger fs-1 cursor-pointer scale-1-3" onclick="remove_variants_json(event); list_to_json()">
                                       <span class="path1"></span>
                                       <span class="path2"></span>
                                    </i>`
                variantsJsonContainer.append(container)
                get_transportation_title(uuid, container)
            }
        }
    }

    function get_trade_transportation_method_json(){
        $.ajax({
            url: '/inquiry/trade_transportation_method/json/',
            dataType: "json",
            type: "GET",
            async: false,
            data: {supplier: supplier?.value, sku: sku?.value},
            cache: false,
            success: function (data) {
                debugger
                document.querySelector('#id_trade_transportation_method_json').value = JSON.stringify(data['res'])
            }
        }); // end ajax
    }
    setTimeout(get_trade_transportation_method_json, 1000)

    setTimeout(show_transportation_title, 1000)
</script>
