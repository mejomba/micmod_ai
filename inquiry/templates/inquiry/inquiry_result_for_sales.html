{% extends 'partials/base_level2.html' %}
{% load more_tags %}
{% block form_content %}
    <div id="custom-error" class="d-flex justify-content-between alert alert-danger alert-dismissable d-none fade show"
         role="alert">
        <span></span>
    </div>
    <div class="gap-3 bg-white rounded shadow pt-3 px-1 ">
        {% csrf_token %}
        <div id="id_ajax">
            {% include 'inquiry/partial/partial_inquiry_result_for_sales.html' %}
        </div>
    </div>
{% endblock form_content %}
{% block content %}

{% endblock %}

{% block extra_js %}

    <script>
        function refresh_data(e) {
            if (e.type === "change" || e.type === "mouseup" || e.keyCode === 13) {
                e.preventDefault();
                const skuInput = document.querySelector('#id_sku_c')
                const requiredField = [skuInput.value]
                if (requiredField.every(Boolean)) {
                    custom_ajax_get($("#main-form"), baseUrl + `/inquiry/ajax/inquiryresult/forsale/`, $("#id_ajax"))
                }
            }
        }

        $(document).ready(function() {
          $(window).keydown(function(event){
            if(event.keyCode == 13) {
              event.preventDefault();
              return false;
            }
          });
        });

        $('#main-form').submit(function (e) {
            e.preventDefault();
            if (e.keyCode != '13'){
                custom_ajax_post(e.target, baseUrl + `/inquiry/ajax/inquiryresult/forsale/`, $("#id_ajax"))
                }
        })
    </script>

    <script src="{% static 'libs/select2/dist/js/select2.full.min.js' %}"></script>
<script>

    function select2_sku_c(){
        $('#select2_sku_c').select2({
            ajax: {
                url: '/inquiry/items_list/',
                dataType: "json",
                type: "GET",
                data: function (data) {
                    return {q: data.term, page: data.page}
                },
                processResults: function (data, params) {
                    params.page = params.page || 1;
                    return {
                        results: data.items,
                        pagination: {
                            more: (params.page * 30) < data.total_count
                        }
                    };
                },
                cache: true
            },
            minimumInputLength: 1,
            placeholder: {
                text: "کد کالا، پارت نامبر"
            },
            allowClear: false,
            templateResult: formatRepoDL,
            templateSelection: formatRepoSelection
        });

        $('#select2_sku_c').on("select2:select", function (e) {
            const data = e.params.data;
            $(document).find("#id_sku_c").val(data.id)
            refresh_data(event)
        })

        $('#select2_sku_c').on("select2:open", function (e){
            document.querySelector('.select2-search__field')?.focus();
            const s2_input = document.querySelector('.select2-search__field')
            const prev_value = document.querySelector("#id_prev_value")
            s2_input.addEventListener('input', function (e){
                if(prev_value){
                    prev_value.value = s2_input.value
                }
            })
            {#const sku_c = document.querySelector('#id_sku_c')#}
            s2_input.value = prev_value.value
        })
    }

    window.addEventListener("DOMContentLoaded", function (){
        select2_sku_c()
    })


    function formatRepoDL(repo) {
        if (repo.loading) {
            return repo.text;
        }
        var $container = $(`
        <div class='d-flex'>
<span class="bg-light-success rounded px-1 me-3">${repo.id}</span>
<span>${repo.text}</span>
</div>
`);
        return ($container)
    }

    function formatRepoSelection(repo) {
        return repo.id || repo.text
    }
</script>
{% endblock extra_js %}
