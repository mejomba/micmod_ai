<div>
    <!--begin::Image input-->
    <div class="image-input image-input-outline" data-kt-image-input="true"
         style="background-image: url({% static 'media/svg/avatars/blank.svg' %})">
        <!--begin::Preview existing avatar-->
        <div class="image-input-wrapper w-125px h-125px"
             style="background-image: url({% if field.value %} {{ field.value.url }} {% else %} {% static 'media/svg/avatars/blank.svg' %} {% endif %})"></div>
        <!--end::Preview existing avatar-->

        <!--begin::Label-->
        <label class="btn btn-icon btn-circle btn-active-color-primary w-25px h-25px bg-body shadow"
               data-kt-image-input-action="change" data-bs-toggle="tooltip"
               aria-label="Change avatar" data-bs-original-title="Change avatar"
               data-kt-initialized="1">
            <i class="ki-duotone ki-pencil fs-7"><span class="path1"></span><span
                    class="path2"></span></i>
            <!--begin::Inputs-->
            <input type="file" name="{{ field.name }}" accept=".png, .jpg, .jpeg">
            <input type="hidden" name="{{ field.name }}-clear">
            <!--end::Inputs-->
        </label>
        <!--end::Label-->

        <!--begin::Cancel-->
        <span class="btn btn-icon btn-circle btn-active-color-primary w-25px h-25px bg-body shadow"
              data-kt-image-input-action="cancel" data-bs-toggle="tooltip"
              aria-label="Cancel avatar" data-bs-original-title="Cancel avatar"
              data-kt-initialized="1">
                                <i class="ki-duotone ki-cross fs-2"><span class="path1"></span><span
                                        class="path2"></span></i>                            </span>
        <!--end::Cancel-->

        <!--begin::Remove-->
        <span class="btn btn-icon btn-circle btn-active-color-primary w-25px h-25px bg-body shadow"
              data-kt-image-input-action="remove" data-bs-toggle="tooltip"
              aria-label="Remove avatar" data-bs-original-title="Remove avatar"
              data-kt-initialized="1">
                                <i class="ki-duotone ki-cross fs-2"><span class="path1"></span><span
                                        class="path2"></span></i>                            </span>
        <!--end::Remove-->
    </div>
    <!--end::Image input-->
    <!--begin::Hint-->
    <div class="form-text">فایل های مجاز: png, jpg, jpeg.</div>
    <!--end::Hint-->
</div>
