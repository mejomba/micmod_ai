{% load more_tags %}
<a href="#" class="btn btn-primary er fs-6 px-8 py-4" data-bs-toggle="modal" data-bs-target="#kt_modal_invite_friends">نظر
    کاربران</a>

<div class="modal fade" id="kt_modal_invite_friends" tabindex="-1" style="display: none;" aria-hidden="true">
    <!--begin::Modal dialog-->
    <div class="modal-dialog mw-650px">
        <!--begin::Modal content-->
        <div class="modal-content">
            <!--begin::Modal header-->
            <div class="modal-header pb-0 border-0 justify-content-end">
                <!--begin::Close-->
                <div class="btn btn-sm btn-icon btn-active-color-primary" data-bs-dismiss="modal">
                    <i class="ki-duotone ki-cross fs-1"><span class="path1"></span><span class="path2"></span></i></div>
                <!--end::Close-->
            </div>
            <!--begin::Modal header-->
            <!--begin::Modal body-->
            <div class="modal-body scroll-y mx-5 mx-xl-18 pt-0 pb-15">
                <!--begin::Heading-->
                <div class="text-center mb-13">
                    <!--begin::Title-->
                    <h1 class="mb-3">نظرات</h1>
                    <!--end::Title-->

                    <div>{% include "comments.html" %}</div>
                    {% for comment in comments %}
                        <div data-kt-inbox-message="message_wrapper"  class="mb-10 border-right-1 pt-2 px-1" style="border-right: 1px solid var(--bs-gray-400)">
                            <!--begin::Message header-->
                            <div class="d-flex flex-wrap gap-2 flex-stack cursor-pointer"
                                 data-kt-inbox-message="header">
                                <!--begin::Author-->
                                <div class="d-flex align-items-baseline">
                                    <!--begin::Author details-->
                                    <div>
                                        <img src="{{ comment.creator_user.profile.avatar.url }}" alt="user_image__{{ comment.creator_user.firstname }}" class="rounded-circle" width="32" height="32">
                                    </div>
                                    <p class="me-4 ms-2 fw-bold text-active-gray-800" >
                                        {{ comment.creator_user }}
                                    </p>
                                    <p class="font-size-10 font-italic text-muted text-end" style="font-style: italic">
                                        {{ comment.elapsed_time }}
                                    </p>
                                    <!--end::Author details-->
                                </div>
                                <!--end::Author-->

                                <!--begin::Actions-->
                                <div class="d-flex align-items-center flex-wrap gap-2">
                                    <!--begin::Date-->
                                    <p class="badge ms-auto {% if comment.comment_title == 'C' %} badge-light-danger {% else %} badge-light-info {% endif %}">
                                        {{ comment.get_comment_title_display }}
                                    </p>
                                    <!--end::Date-->
                                    <div class="d-flex">
                                    </div>
                                </div>
                                <!--end::Actions-->
                            </div>
                            <!--end::Message header-->

                            <!--begin::Message content-->
                            <div class="d-flex justify-content-start">
                                <p class="px-4" style="text-align: right">{{ comment.comment_content|get_comment_link }}</p>
                            </div>
                        </div>
                    {% endfor %}


                </div>
                <!--end::Modal body-->
            </div>
            <!--end::Modal content-->
        </div>
        <!--end::Modal dialog-->
    </div>
</div>
