<div class="align-items-center border border-dashed border-gray-300 rounded px-7 py-3 mb-5 position-relative card-rounded bg-hover-light-primary"
     onclick="read_message({{ notification.id }})" id="notification_{{ notification.id }}">
    {% if notification.read_status == '0' %}
        <div class="ribbon ribbon-triangle ribbon-top-end border-danger">
            <div class="ribbon-icon mt-n5 me-n6">
                <i class="bi bi-lightning-fill text-white fs-2"></i>
            </div>
        </div>{% endif %}
    <a href="{{ notification.link }}" class="text-reset " target="_blank">
        <div class="d-flex">
            {% getIcon notification.icon_url 'fs-4x' %}
            <div class="flex-grow-1">
                {% if with_title %}
                    <h6 class="mb-1">{{ notification.title }}</h6>
                {% endif %}
                <div class="font-size-13">
                    <p class="mb-1">{{ notification.body }}</p>
                </div>
            </div>
        </div>
        <hr>
        <p class="mb-0">{% getIcon 'to-left' 'fs-2' %}
            <span>{{ notification.elapsed_time }}</span></p>
    </a>
</div>
