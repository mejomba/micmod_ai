{% extends 'partials/base.html' %}
{% load static %}
{% load quotation_tag %}
{% load jalali_tags %}

{% block title %}سفارش{% endblock title %}
{% block extra_css %}
<!-- Responsive Table css -->
<link href="{% static 'libs/admin-resources/rwd-table/rwd-table.min.css' %}" rel="stylesheet" type="text/css" />
    <!-- DataTables -->
    <link href="{% static 'libs/datatables.net-bs4/css/dataTables.bootstrap4.min.css'%}" rel="stylesheet" type="text/css" />
    <link href="{% static 'libs/datatables.net-buttons-bs4/css/buttons.bootstrap4.min.css'%}" rel="stylesheet" type="text/css" />

    <!-- Responsive datatable examples -->
    <link href="{% static 'libs/datatables.net-responsive-bs4/css/responsive.bootstrap4.min.css'%}" rel="stylesheet" type="text/css" />


    <link href="//cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css" rel="stylesheet" type="text/css" />
    <link href="https://cdn.datatables.net/buttons/2.4.1/css/buttons.dataTables.min.css" rel="stylesheet" type="text/css" />

    <style>
    .loader {
        position: fixed;
        z-index: 10;
        width: 100vw;
        height: 1000px;
        background-color: #b8c6f6;
        opacity: 0.3;
    }
    .loader-inner {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
    }
    </style>
{% endblock %}

{% block content %}
    <!-- loader for prevent user to click -->
    <div class="loader" id="page-loader">
        <div class="loader-inner">
            <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status">
              <span class="sr-only">Loading...</span>
            </div>
        </div>
    </div>
        <!-- ============================================================== -->
        <!-- Start right Content here -->
        <!-- ============================================================== -->
        <div class="main-content">
            <div class="page-content">
                <div class="container-fluid">
                <div class="row">
                    <div class="col-12">

                        <div class="container-fluid">
                            <div class="table-responsive p-2">
                                <table id="datatable_order_list" width="100%" class="m-table table-striped table-bordered w-100">
                                    <thead>
                                        <tr>
                                        </tr>
                                    </thead>
                                </table>
                            </div>
                        </div>

                    </div>
                </div>
                </div> <!-- container-fluid -->
            </div>
            <!-- End Page-content -->
        </div>
        <!-- end main content-->
{% endblock content %}

{% block extra_js %}
    <script>
        function removeLoader(){
            const pageLoader = document.querySelector('#page-loader');
            pageLoader.classList.add('d-none')
        }
        document.addEventListener('DOMContentLoaded', function (){
            //setTimeout(removeLoader, 1000);
            removeLoader();
        })
    </script>

    <script language="javascript">
    $(document).ready(function() {
        AjaxDatatableViewUtils.initialize_table(
            $('#datatable_order_list'),
            "{% url 'dw:order_list.datatable' %}",
            {
                // extra_options (example)
                processing: true,
                autoWidth: false,
                full_row_select: false,
                scrollX: false,
                bFilter: true,
                dom: 'Blfrtip',
                buttons: [
                    'copyHtml5',
                    'excelHtml5',
                    'csvHtml5',
                    'pdfHtml5'
                ]
            }, {
                // extra_data
            },
        );
        $('.replace-digits').replaceDigits();
        console.log($('.replace-digits'))
    });
    </script>

        <!-- Required datatable js -->
        <script src="{% static 'libs/datatables.net/js/jquery.dataTables.min.js' %}"></script>
        <script src="{% static 'libs/datatables.net-bs4/js/dataTables.bootstrap4.min.js' %}"></script>
        <!-- Buttons examples -->
        <script src="{% static 'libs/datatables.net-buttons/js/dataTables.buttons.min.js' %}"></script>
        <script src="{% static 'libs/datatables.net-buttons-bs4/js/buttons.bootstrap4.min.js' %}"></script>
        <script src="{% static 'libs/jszip/dist/jszip.min.js' %}"></script>
        <script src="{% static 'libs/pdfmake/build/pdfmake.min.js' %}"></script>
        <script src="{% static 'libs/pdfmake/build/vfs_fonts.js' %}"></script>
        <script src="{% static 'libs/datatables.net-buttons/js/buttons.html5.min.js' %}"></script>
        <script src="{% static 'libs/datatables.net-buttons/js/buttons.print.min.js' %}"></script>
        <script src="{% static 'libs/datatables.net-buttons/js/buttons.colVis.min.js' %}"></script>

    <script src="{% static 'js/extra/quotation.js'%}"></script>


{% endblock extra_js %}
