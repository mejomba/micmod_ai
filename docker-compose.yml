version: '3.10'

services:
  redis:
    image: "redis:alpine"
    hostname: redis
    #ports:
    #  - '6371:6379'
    networks:
      - live
  db:

    image: postgres:latest
    restart: always
    ports:
      - "5440:5432"
    env_file:
      - _keenthemes/.env
    networks:
      - live
  tlegram:
    build:
      context: .
      #dockerfile: Dockerfile
    command: bash -c "python manage.py run_telegram"
    volumes:
      - .:/app
    #environment:
    #  - REDIS_HOST=redis
    depends_on:
      - db
      - redis
      - web
    env_file:
      - _keenthemes/.env
    networks:
      - live
  web:
    build: 
      context: .
      #dockerfile: Dockerfile
    command: bash -c "python manage.py makemigrations && python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    #environment:
    #  - REDIS_HOST=redis
    ports:
      - "3000:8000"
      #- "5432:5432"
    depends_on:
      - db
      - redis
    env_file:
      - _keenthemes/.env
    networks:
      - live


  nginx:
    image: nginx
    hostname: nginx
    ports:
      - '83:8000'
    volumes:
      - ./config/nginx:/etc/nginx/conf.d
    depends_on:
      - web
    networks:
      - live

  celery:
    build:
      context: .
      #dockerfile: Dockerfile
    command: "celery -A _keenthemes worker --loglevel=info -P eventlet"
    depends_on:
      - web
      - redis
      - db
    restart: on-failure
    networks:
      - live

  celerybeat:
    build:
      context: .
    command: "celery -A _keenthemes worker --loglevel=info -P eventlet"
    depends_on:
      - celery
      - web
      - redis
      - db
    restart: on-failure
    networks:
      - live 

networks:
  live: