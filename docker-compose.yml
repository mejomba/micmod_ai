version: '3.10'

services:
  redis:
    image: "redis:alpine"
    hostname: redis
#    ports:
#      - '6375:6379'
    networks:
      - live

  db:
    image: postgres:latest
    restart: always
    ports:
      - "5441:5432"
    env_file:
      - _keenthemes/.env
    networks:
      - live

  tlegram:
    build:
      context: .
      #dockerfile: Dockerfile
    command: bash -c "python manage.py run_telegram"
    volumes:
      - .:/app
    #environment:
    #  - REDIS_HOST=redis
    depends_on:
      - db
      - redis
    env_file:
      - _keenthemes/.env
    networks:
      - live

  web:
    build:
      context: .
      #dockerfile: Dockerfile
    command: bash -c "python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    #environment:
    #  - REDIS_HOST=redis
    ports:
      - "1000:8000"
      #- "5432:5432"
    depends_on:
      - db
      - redis
    env_file:
      - _keenthemes/.env
    networks:
      - live

  web_https:
    build:
      context: .
      #dockerfile: Dockerfile
    command: bash -c "manage.py runsslserver 0.0.0.0:4000"
    volumes:
      - .:/app
    #environment:
    #  - REDIS_HOST=redis
    ports:
      - "2000:4000"
      #- "5432:5432"
    depends_on:
      - db
      - redis
    env_file:
      - _keenthemes/.env
    networks:
      - live

  nginx:
    image: nginx
    hostname: nginx
    ports:
      - '83:8000'
    volumes:
      - ./config/nginx:/etc/nginx/conf.d
    depends_on:
      - web
    networks:
      - live

  celery:
    build:
      context: .
      #dockerfile: Dockerfile
    command: "celery -A _keenthemes worker --loglevel=info -P eventlet"
    depends_on:
      - redis
      - db
    restart: on-failure
    env_file:
      - _keenthemes/.env
    environment:
      - SECRET_KEY=django-insecure-blehs+vjho@s4qug%9ferf0-tucvbr9#_1k2!#ebs4u68@)ss+
      - DJANGO_ALLOWED_HOSTS=localhost 127.0.0.1 [::1]
    networks:
      - live
    volumes:
      - .:/app

  celerybeat:
    build:
      context: .
    command: "celery -A _keenthemes worker --beat --scheduler django --loglevel=info"
    depends_on:
      - celery
      - redis
      - db
    restart: on-failure
    env_file:
      - _keenthemes/.env
    environment:
      - SECRET_KEY=django-insecure-blehs+vjho@s4qug%9ferf0-tucvbr9#_1k2!#ebs4u68@)ss+
      - DJANGO_ALLOWED_HOSTS=localhost 127.0.0.1 [::1]
    networks:
      - live
    volumes:
      - .:/app

networks:
  live: