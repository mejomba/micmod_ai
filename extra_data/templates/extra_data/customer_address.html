{% load static %}
{% load more_tags %}

<form action="{% if form.instance.pk %}{% url 'extra_data:customer_address.update' form.instance.pk %}{% else %}{% url 'extra_data:customer_address.create' %}{% endif %}" method="POST" id="customer-address-form">
    {% csrf_token %}
    <div class="row bg-white rounded border my-10 pt-10 position-relative shadow-sm mx-xl-10">
        <h4 class="position-absolute" style="top: -10px">آدرس ارسال کالا مشتری</h4>
        {% render_field_by_order form form.address label='on-border' margin_b=4 %}
        <span class="d-none">{{ form.type }} {{ form.customer }}</span>
    </div>
<input type="submit" value="ثبت" id="submit-customer-change-marketer" class="btn btn-primary ms-10">
</form>

<script>
    $('#customer-address-form').on('submit', function (e){
        e.preventDefault()
        ajax_submit(this, true, true)
        setInterval(function (){
            $("#id_kt_empty_modal_lg").hide()
        }, 500)
    })

</script>
