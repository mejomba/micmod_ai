{% load static %}
{% load more_tags %}

<form action="{% if form.instance.pk %}{% url 'extra_data:customer_change_marketer.update' form.instance.pk %}{% else %}{% url 'extra_data:customer_change_marketer.create' %}{% endif %}" method="POST" id="customer-change-marketer-form">
    {% csrf_token %}
    <div class="row row-cols-3 bg-white rounded border my-10 pt-10 position-relative shadow-sm mx-xl-10">
        <h4 class="position-absolute" style="top: -10px">تغییر کارشناس</h4>
        {% render_field_by_order form form.customer form.from_marketer form.to_marketer label='on-border' margin_b=4 %}
    </div>
<input type="submit" value="ثبت" id="submit-customer-change-marketer" class="btn btn-primary ms-10">
</form>

<script>
    $('#customer-change-marketer-form').on('submit', function (e){
        e.preventDefault()
        ajax_submit(this)
        setInterval(function (){
            window.location.reload()
            $('#id_kt_empty_modal_lg').hide();
        }, 600)
    })

</script>
