

<style>
.sf-card {
  background: #fff;
  border: 1px solid #e5e7eb;
  border-radius: 12px;
  padding: 1rem 1.25rem;
  max-width: 560px;
  font-family: inherit;
}

.sf-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}

.sf-title-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.sf-icon {
  width: 34px;
  height: 34px;
  border-radius: 8px;
  background: #eff6ff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 17px;
  color: #2563eb;
  flex-shrink: 0;
}

.sf-title {
  font-size: 14px;
  font-weight: 600;
  color: #111827;
}

.sf-subtitle {
  font-size: 12px;
  color: #6b7280;
  margin-top: 1px;
}

.sf-refresh-btn {
  background: none;
  border: 1px solid #e5e7eb;
  border-radius: 8px;
  padding: 5px 11px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  color: #6b7280;
  font-family: inherit;
  transition: background 150ms;
}

.sf-refresh-btn:hover {
  background: #f9fafb;
}

.sf-divider {
  border: none;
  border-top: 1px solid #f3f4f6;
  margin: 0 0 14px;
}

.sf-body {
  min-height: 52px;
  max-height: 190px;
  overflow-y: auto;
  overflow-x: hidden;  /* ← جلوگیری از بیرون رفتن */
}

.sf-links {
  display: flex;
  flex-wrap: wrap;     /* ← این باید باشه */
  gap: 6px;
  margin-bottom: 14px;
  width: 100%;         /* ← اضافه کن */
}
.sf-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: #eff6ff;
  border: 1px solid #bfdbfe;
  border-radius: 20px;
  padding: 3px 11px;
  font-size: 12px;
  color: #1d4ed8;
  text-decoration: none;
  cursor: pointer;
  transition: opacity 150ms;
}

.sf-chip:hover {
  opacity: 0.75;
}

.sf-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.sf-count-wrap {
  display: flex;
  align-items: baseline;
  gap: 7px;
}

.sf-count-label {
  font-size: 12px;
  color: #6b7280;
}

.sf-count-val {
  font-size: 22px;
  font-weight: 700;
  color: #111827;
  line-height: 1;
}

.sf-timer {
  font-size: 11px;
  color: #9ca3af;
  display: flex;
  align-items: center;
  gap: 4px;
}

.sf-progress {
  height: 3px;
  background: #f3f4f6;
  border-radius: 2px;
  margin-top: 12px;
  overflow: hidden;
}

.sf-progress-bar {
  height: 100%;
  background: #2563eb;
  border-radius: 2px;
  width: 100%;
}

.sf-skeleton {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 14px;
}

.sf-skel-chip {
  height: 26px;
  border-radius: 20px;
  background: #f3f4f6;
  animation: sfPulse 1.4s ease-in-out infinite;
}

.sf-empty,
.sf-error {
  font-size: 13px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.sf-empty { color: #6b7280; }
.sf-error  { color: #dc2626; }

@keyframes sfPulse {
  0%, 100% { opacity: 1; }
  50%       { opacity: 0.45; }
}

@keyframes sfSpin {
  to { transform: rotate(360deg); }
}

.sf-spin {
  display: inline-block;
  animation: sfSpin 0.8s linear infinite;
}
</style>

<!-- ─── HTML ─── -->
<div class="sf-card mb-5">
  <div class="sf-header">
    <div class="sf-title-row">
      <div class="sf-icon">&#128196;</div>
      <div>
        <div class="sf-title">فاکتورهای تامین‌شده</div>
        <div class="sf-subtitle">بروزرسانی خودکار هر ۲ دقیقه</div>
      </div>
    </div>
    <button class="sf-refresh-btn" id="sfRefreshBtn" onclick="sfManualRefresh()" title="بروزرسانی">
      <span id="sfRefreshIcon">&#8635;</span>
      <span>بروزرسانی</span>
    </button>
  </div>

  <hr class="sf-divider">

  <div class="sf-body" id="sfBody">
    <div class="sf-skeleton">
      <div class="sf-skel-chip" style="width:52px"></div>
      <div class="sf-skel-chip" style="width:66px"></div>
      <div class="sf-skel-chip" style="width:44px"></div>
    </div>
  </div>

  <div class="sf-footer">
    <div class="sf-count-wrap">
      <span class="sf-count-label">تعداد فاکتور</span>
      <span class="sf-count-val" id="sfCountVal">—</span>
    </div>
    <div class="sf-timer">
      &#9201;
      <span id="sfTimerLabel">در حال بارگذاری...</span>
    </div>
  </div>

  <div class="sf-progress">
    <div class="sf-progress-bar" id="sfProgressBar"></div>
  </div>
</div>

<!-- ─── JavaScript ─── -->
<script>
(function () {
  /* ── تنها چیزی که باید عوض کنی ── */
  var API_URL = "/factor/ajax/show_all_supplied_factor/"; /* ← URL خودت */

  var INTERVAL_MS = 120000; /* 2 دقیقه */
  var countdown   = INTERVAL_MS / 1000;
  var timerLoop   = null;

  /* ── fetch داده ── */
  function loadData(isManual) {
    var icon     = document.getElementById("sfRefreshIcon");
    var body     = document.getElementById("sfBody");
    var countVal = document.getElementById("sfCountVal");

    icon.className = "sf-spin";
    icon.textContent = "↻";

    if (!isManual) {
      body.innerHTML =
        '<div class="sf-skeleton">' +
          '<div class="sf-skel-chip" style="width:52px"></div>' +
          '<div class="sf-skel-chip" style="width:66px"></div>' +
          '<div class="sf-skel-chip" style="width:44px"></div>' +
        '</div>';
      countVal.textContent = "—";
    }

    $.ajax({
      url: API_URL,
      method: "GET",
      success: function (data) {
        icon.className = "";
        icon.textContent = "⟳";

        if (!data.res || data.res.length === 0) {
          body.innerHTML =
            '<div class="sf-empty">' +
              '⚠ فاکتوری موجود نیست' +
            '</div>';
          countVal.textContent = "0";
          return;
        }

        var chips = data.res.map(function (id) {
          return '<a href="/factor/view/' + id + '" class="sf-chip" target="_blank">' +
                   '↗ ' + id +
                 '</a>';
        }).join("");

        body.innerHTML = '<div class="sf-links">' + chips + '</div>';
        countVal.textContent = data.count !== undefined ? data.count : data.res.length;

        sfStartProgress();
      },
      error: function () {
        icon.className = "";
        icon.textContent = "⟳";
        body.innerHTML =
          '<div class="sf-error">' +
            '✕ خطا در دریافت اطلاعات' +
          '</div>';
      }
    });
  }

  /* ── نوار پیشرفت ── */
  function sfStartProgress() {
    var bar = document.getElementById("sfProgressBar");
    bar.style.transition  = "none";
    bar.style.width       = "100%";
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        bar.style.transition = "width " + INTERVAL_MS + "ms linear";
        bar.style.width      = "0%";
      });
    });
  }

  /* ── تایمر معکوس ── */
  function sfFormatCountdown(s) {
    var m   = Math.floor(s / 60);
    var sec = s % 60;
    return m + ":" + (sec < 10 ? "0" + sec : sec) + " تا بروزرسانی";
  }

  function sfStartTimer() {
    clearInterval(timerLoop);
    countdown = INTERVAL_MS / 1000;
    timerLoop = setInterval(function () {
      countdown = Math.max(0, countdown - 1);
      document.getElementById("sfTimerLabel").textContent = sfFormatCountdown(countdown);
      if (countdown === 0) {
        countdown = INTERVAL_MS / 1000;
        loadData(false);
      }
    }, 1000);
  }

  /* ── بروزرسانی دستی ── */
  window.sfManualRefresh = function () {
    sfStartTimer();
    sfStartProgress();
    loadData(true);
  };

  /* ── شروع ── */
  /* منتظر می‌مونیم jQuery و DOM کاملاً لود بشن */
  function sfInit() {
    loadData(false);
    sfStartProgress();
    sfStartTimer();
  }

  if (typeof $ === "undefined") {
    window.addEventListener("load", sfInit);
  } else {
    $(document).ready(sfInit);
  }

})();
</script>
