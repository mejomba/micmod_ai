<!--
  ویجت «جمع مبلغ فاکتورهای امروز» — تم سفید/آبی، فشرده و افقی
  اتصال واقعی: DEMO_MODE=false و ENDPOINT را تنظیم کن.
-->
<div class="ttw-scope" dir="rtl">
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />

  <section class="ttw-card" aria-label="جمع مبلغ فاکتورهای امروز">
    <div class="ttw-main">
      <header class="ttw-head">
        <span class="ttw-pulse" aria-hidden="true"></span>
        <div>
          <p class="ttw-kicker">گزارش لحظه‌ای</p>
          <h2 class="ttw-title">جمع فاکتورهای امروز</h2>
        </div>
        <time class="ttw-date" id="ttwDate"></time>
      </header>

      <div class="ttw-amount-wrap">
        <div class="ttw-amount" id="ttwAmount" aria-live="polite">
          <span class="ttw-placeholder">برای محاسبه دکمه را بزنید</span>
        </div>
        <span class="ttw-unit" id="ttwUnit" hidden>ریال</span>
      </div>
      <p class="ttw-hint" id="ttwHint"></p>
    </div>

    <button class="ttw-btn" id="ttwBtn" type="button" title="محاسبه‌ی جمع امروز" aria-label="محاسبه‌ی جمع امروز">
      <svg class="ttw-btn-ico" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <path d="M21 12a9 9 0 1 1-2.64-6.36" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M21 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="ttw-spinner" aria-hidden="true"></span>
    </button>
  </section>
</div>

<style>
  .ttw-scope{
    --blue:#1f6feb; --blue-soft:#4f9df5; --blue-deep:#0b4aa2;
    --ink:#102a4c; --muted:#6b8299; --line:#e2ebf6; --danger:#e11d48;
    font-family:"Vazirmatn",system-ui,sans-serif;
    display:flex;justify-content:center;padding:16px;color:var(--ink);
  }
  .ttw-scope *{box-sizing:border-box;}

  .ttw-card{
    position:relative;width:100%;max-width:487px;overflow:hidden;
    display:flex;align-items:center;gap:16px;
    background:
      radial-gradient(120% 90% at 100% 0%, rgba(31,111,235,.10), transparent 60%),
      linear-gradient(180deg,#ffffff 0%, #fbfdff 100%);
    border:1px solid var(--line);border-radius:16px;
    padding:14px 18px;
    box-shadow:0 14px 34px -22px rgba(16,42,76,.30), 0 1px 4px rgba(16,42,76,.05);
  }
  .ttw-card::before{
    content:"";position:absolute;top:0;right:0;width:4px;height:100%;
    background:linear-gradient(180deg,var(--blue-deep),var(--blue),var(--blue-soft));
  }
  .ttw-main{flex:1;min-width:0;}

  .ttw-head{display:flex;align-items:center;gap:8px;}
  .ttw-pulse{
    width:8px;height:8px;border-radius:50%;background:var(--blue);flex:none;
    box-shadow:0 0 0 0 rgba(31,111,235,.55);animation:ttwPulse 2.4s infinite;
  }
  @keyframes ttwPulse{0%{box-shadow:0 0 0 0 rgba(31,111,235,.55)}70%{box-shadow:0 0 0 7px rgba(31,111,235,0)}100%{box-shadow:0 0 0 0 rgba(31,111,235,0)}}
  .ttw-kicker{margin:0;font-size:9px;letter-spacing:.4px;color:var(--blue);font-weight:600;}
  .ttw-title{margin:0;font-size:13px;font-weight:700;}
  .ttw-date{margin-right:auto;font-size:10px;color:var(--muted);white-space:nowrap;}

  .ttw-amount-wrap{display:flex;align-items:baseline;gap:6px;margin-top:8px;}
  .ttw-amount{
    font-weight:800;line-height:1.1;letter-spacing:-.5px;
    font-variant-numeric:tabular-nums;white-space:nowrap;
    background:linear-gradient(180deg,var(--blue),var(--blue-deep));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .ttw-placeholder{font-size:12px;font-weight:500;color:var(--muted);
    -webkit-text-fill-color:var(--muted);background:none;letter-spacing:0;}
  .ttw-amount.is-error,.ttw-amount.is-error .ttw-placeholder{-webkit-text-fill-color:var(--danger);color:var(--danger);}
  .ttw-unit{font-size:11px;color:var(--muted);flex:none;}
  .ttw-hint{margin:4px 0 0;font-size:10px;color:var(--muted);min-height:12px;}

  .ttw-btn{
    flex:none;width:46px;height:46px;border:none;border-radius:12px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;color:#fff;
    background:linear-gradient(180deg,var(--blue-soft),var(--blue));
    box-shadow:0 8px 18px -8px rgba(31,111,235,.65);
    transition:transform .15s ease, box-shadow .2s ease, filter .2s ease;
  }
  .ttw-btn:hover{transform:translateY(-2px);box-shadow:0 12px 22px -10px rgba(31,111,235,.75);filter:brightness(1.04);}
  .ttw-btn:active{transform:translateY(0);}
  .ttw-btn:disabled{cursor:wait;filter:saturate(.6) brightness(.97);transform:none;}
  .ttw-btn.is-loading .ttw-btn-ico{display:none;}
  .ttw-spinner{display:none;width:18px;height:18px;border-radius:50%;
    border:2px solid rgba(255,255,255,.4);border-top-color:#fff;animation:ttwSpin .7s linear infinite;}
  .ttw-btn.is-loading .ttw-spinner{display:inline-block;}
  @keyframes ttwSpin{to{transform:rotate(360deg)}}
</style>

<script>
(function(){
  const DEMO_MODE = false;
  const ENDPOINT  = "/factor/ajax/factor_today_total_price/";
  const QUERY     = "?q=my_today_factor_price";

  const scope  = document.currentScript.closest('.ttw-scope') || document;
  const btn    = scope.querySelector('#ttwBtn');
  const amount = scope.querySelector('#ttwAmount');
  const unit   = scope.querySelector('#ttwUnit');
  const hint   = scope.querySelector('#ttwHint');
  const dateEl = scope.querySelector('#ttwDate');

  const MAX_FONT = 28, MIN_FONT = 14;

  try {
    dateEl.textContent = new Intl.DateTimeFormat('fa-IR',{day:'numeric', month:'long'}).format(new Date());
  } catch(e){ dateEl.textContent = new Date().toLocaleDateString('fa-IR'); }

  const faNum = n => new Intl.NumberFormat('fa-IR').format(n);
  function setLoading(on){ btn.classList.toggle('is-loading', on); btn.disabled = on; }

  function fitFont(text){
    amount.style.fontSize = MAX_FONT + 'px';
    amount.textContent = text;
    let size = MAX_FONT;
    const limit = amount.parentElement.clientWidth - unit.offsetWidth - 6;
    while (amount.scrollWidth > limit && size > MIN_FONT){ size -= 1; amount.style.fontSize = size + 'px'; }
  }

  function countUp(target){
    amount.classList.remove('is-error');
    unit.hidden = false;
    fitFont(faNum(target));
    const dur = 800, t0 = performance.now();
    function frame(now){
      const p = Math.min((now - t0)/dur, 1);
      const eased = 1 - Math.pow(1 - p, 3);
      amount.textContent = faNum(Math.round(target * eased));
      if (p < 1) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  function showPlaceholder(msg, isError){
    amount.style.fontSize = '';
    amount.classList.toggle('is-error', !!isError);
    amount.innerHTML = '<span class="ttw-placeholder">' + msg + '</span>';
    unit.hidden = true;
  }

  async function fetchTotal(){
    if (DEMO_MODE){
      await new Promise(r => setTimeout(r, 700));
      return { total_price: Math.floor(Math.random()*900_000_000)+1_000_000 };
    }
    const res = await fetch(ENDPOINT + QUERY, {
      method:'GET', headers:{'X-Requested-With':'XMLHttpRequest'}, credentials:'same-origin'
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }

  btn.addEventListener('click', async () => {
    setLoading(true); hint.textContent = '';
    try {
      const data = await fetchTotal();
      if (!data.total_price && data.total_price !== 0){
        showPlaceholder('فاکتوری برای امروز ثبت نشده', false);
      } else {
        countUp(Number(data.total_price));
        hint.textContent = 'به‌روزرسانی شد';
      }
    } catch (err){
      showPlaceholder('خطا در دریافت اطلاعات', true);
      hint.textContent = 'دوباره تلاش کنید.';
      console.error(err);
    } finally { setLoading(false); }
  });
})();
</script>
