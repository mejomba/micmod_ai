<!--begin::Activities drawer-->
<div id="kt_notifications" class="bg-body" data-kt-drawer="true" data-kt-drawer-name="notifications"
     data-kt-drawer-activate="true" data-kt-drawer-overlay="true"
     data-kt-drawer-width="{default:'300px', 'lg': '500px'}" data-kt-drawer-direction="end"
     data-kt-drawer-toggle="#kt_notifications_toggle" data-kt-drawer-close="#kt_notifications_close">
    <div class="card shadow-none border-0 rounded-0 w-100" >
        <!--begin::Header-->
        <div class="card-header" id="kt_notifications_header">
            <h3 class="card-title fw-bold text-dark" data-key="t-notifications">Notifications</h3>
            <div class="card-toolbar">
                <button type="button" class="btn btn-sm btn-icon btn-active-light-primary me-n5"
                        id="kt_notifications_close">{% getIcon 'cross' 'fs-1' %}</button>
            </div>
        </div>
        <!--end::Header-->
        <!--begin::Body-->
        <div class="card-body position-relative notificationss" id="ktnotificationsbody">
            <div id="kt_notifications_scroll" class="position-relative scroll-y me-n5 pe-5" data-kt-scroll="true"
                 data-kt-scroll-height="auto" data-kt-scroll-wrappers="#ktnotificationsbody"
                 data-kt-scroll-dependencies="#kt_notifications_header, #kt_notifications_footer"
                 data-kt-scroll-offset="5px">
                {% include 'notifications/partials/notification_header_menu.html' %}
            </div>
        </div>
        <!--end::Body-->
        <!--begin::Footer-->
        <div class="card-footer py-5 text-center" id="kt_notifications_footer">
            <a href="#" class="btn btn-bg-body text-primary">View All
                Activities {% getIcon 'arrow-right' 'fs-3 text-primary' %}</a>
        </div>
        <!--end::Footer-->
    </div>
</div>
<!--end::Activities drawer-->
