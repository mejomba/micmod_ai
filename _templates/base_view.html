{% extends 'partials/base_level2.html' %}
{% load more_tags %}
{% block form_content %}

    <div class="d-flex mt-5 gap-3 bg-white rounded shadow pt-3 px-1">
    {% for field in form %}
        {% render_field_by_order form field label='on-border' %}
    {% endfor %}
    </div>
{% endblock form_content %}

    <script>

            console.log('hide')
          if (formFooterContainer) {
              formFooterContainer.classList.add('position-fixed')
          }
      });
    </script>
{% endblock extra_js %}
