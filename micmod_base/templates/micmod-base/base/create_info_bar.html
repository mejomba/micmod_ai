{% if data %}
<div class="d-flex justify-content-center text-secondary">
    <div class="d-flex">
        <div class="me-2 text-center">
            <p data-key="creator_user" class="p-0 m-0">ایجاد کننده</p>
            <p class="p-0 m-0">{{ data.creator_user }}</p>
        </div>
        <div class="me-2 text-center">
            <p data-key="create_date" class="p-0 m-0">تاریخ ایجاد</p>
            <p class="p-0 m-0">{{ data.created_date }}</p>
        </div>
    </div>
    <div class="d-flex">
        <div class="me-2 text-center">
            <p data-key="updator_user" class="p-0 m-0">ویرایش کننده</p>
            <p class="p-0 m-0">{{ data.editor_user }}</p>
        </div>
        <div class="me-2 text-center">
            <p data-key="last_update_date" class="p-0 m-0">تاریخ ویرایش</p>
            <p class="p-0 m-0">{{ data.last_update_date }}</p>
        </div>
    </div>
</div>
{% endif %}
