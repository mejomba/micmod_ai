{% if not bulk_mode and legal_profile_options %}
<form class="ptb-profile-form quotation-legal-profile-tools noprint" method="get" dir="rtl"
      aria-label="انتخاب پروفایل حقوقی خریدار">
    {% if request.GET.comments_url_params %}<input type="hidden" name="comments_url_params" value="{{ request.GET.comments_url_params }}">{% endif %}
    {% if request.GET.alt_code %}<input type="hidden" name="alt_code" value="{{ request.GET.alt_code }}">{% endif %}
    {% if request.GET.customer_goods_code_url_param %}<input type="hidden" name="customer_goods_code_url_param" value="{{ request.GET.customer_goods_code_url_param }}">{% endif %}
    <div class="ptb-profile-fields">
        <label class="ptb-field" for="quotation-profile-choice">
            <span>مشخصات خریدار برای چاپ</span>
            <select name="legal_profile" id="quotation-profile-choice" class="form-select">
                <option value="" {% if not selected_legal_profile %}selected{% endif %}>اطلاعات پایه مشتری</option>
                {% for option in legal_profile_options %}
                <option value="{{ option.value }}" {% if option.selected %}selected{% endif %}>{{ option.label }}</option>
                {% endfor %}
            </select>
        </label>
        <div class="ptb-profile-actions">
            <button type="submit" class="ptb-button ptb-button--primary">اعمال پروفایل</button>
            <p class="ptb-help">انتخاب فقط روی چاپ تأثیر دارد و در سند ذخیره نمی‌شود.</p>
        </div>
    </div>
</form>
{% endif %}
