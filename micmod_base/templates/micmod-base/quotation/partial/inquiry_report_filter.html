{% load more_tags %}

<table class="table table-bordered">
  <thead>
    <tr>
        <th scope="col" class="text-center">کاربران</th>
        <th scope="col" class="text-center">تخصیص ها</th>

        <th scope="col" class="text-center">شروع شده</th>
        <th scope="col" class="text-center">انجام شده ها</th>
        <th scope="col" class="text-center">مانده ها</th>
        <th scope="col" class="text-center">کل</th>
    </tr>
  </thead>

  <tbody>


    {% for users, quotations in quotationitem_filters.items %}
      <tr>
      <th scope="row">{{ users }}</th>
      <td>{{ quotations.0 }}</td>
      <td>{{ quotations.1 }}</td>
      <td>{{ quotations.2 }}</td>
      <td>{{ quotations.3 }}</td>
      <td>{{ quotations.4 }}</td>

    </tr>
{% endfor %}
  </tbody>
</table>
