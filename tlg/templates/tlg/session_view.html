{% extends "admin/change_form.html" %}
{% load static %}

{% block extrastyle %}
    {{ block.super }}
    <style>
    .admin-btn{
        padding: 1rem 1.5rem;
        background-color: #2b549c;
        border: none;
        border-radius: 0.25rem;
        color: beige;margin: 0 0.5rem;
        cursor: pointer;
    }
    </style>
{#<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">#}
{% endblock %}
{% block submit_buttons_bottom %}
    <div style="display: flex; align-items: center;" >
        <button type="submit" class="admin-btn" name="_continue">Save</button>
        <button class="admin-btn" {% if connected %} disabled {% endif %} name="telegram_send_code"
                url-data="{% url "tlg:send_code" %}"  obj-id="{{ original.id }}">Send Code(Telegram)</button>
        <button style="display: none" class="admin-btn" {% if connected %} disabled {% endif %} name="telegram_loging"
                url-data="{% url "tlg:verify_code" %}"  obj-id="{{ original.id }}">Login Telegram</button>
    <div>{{ original.id }}</div>
    </div>
    {% include 'partials/basejs.html' %}
{% endblock %}
