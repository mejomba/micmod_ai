{% load core_tags %}
<div class="progress" style="height: {{ height }}px; font-size: 9px; background-color: #e1e1e1">
    <div class="progress-bar progress-bar-striped {% if progress_value|reminder:'100' < 0.5 %}bg-primary{% elif progress_value|reminder:'100' < 0.8 %}bg-warning{% else %}bg-danger{% endif %}" role="progressbar" style="width: {{ progress_value }}%;" aria-valuenow="40" aria-valuemin="0" aria-valuemax="100">{{ progress_value }}%</div>
</div>
