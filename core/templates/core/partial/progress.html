{% load core_tags %}
<div class="progress bg-light-primary" style="height: {{ height }}px; font-size: 9px;">
    <div class="progress-bar progress-bar-striped progress-bar-animated {% if progress_value|reminder:'100' < 0.33 %}bg-primary{% elif progress_value|reminder:'100' < 0.66 %}bg-warning{% else %}bg-danger{% endif %}" role="progressbar" style="width: {{ progress_value }}%;" aria-valuenow="40" aria-valuemin="0" aria-valuemax="100">{{ progress_value }}%</div>
</div>
