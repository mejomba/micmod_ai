<div class="symbol-group symbol-hover flex-nowrap">
    {% for comment_info in comments_info %}
        {% if forloop.counter <= 5 %}
            <div class="symbol symbol-35px symbol-circle" data-bs-toggle="tooltip" data-bs-original-title="{{ comment_info.1.username }}:{{ comment_info.0.comment_content|truncatechars:45 }}" data-bs-original-title="{{ comment_info.1.username }}" data-kt-initialized="1">
                {% if not comment_info.0.seen %}
                    <img alt="Pic" class="border border-success border-3"  src="{{ comment_info.2 }}" data-bs-target="#id_kt_empty_modal" id="id_comment__{{ obj.pk }}" data-pk="{{ obj.pk }}" data-form_url="/core/micmod_base/quotationitem/{{ obj.comments.content_type.pk }}/{{ obj.pk }}">
                {% else %}
                    <img alt="Pic" src="{{ comment_info.2 }}" data-bs-target="#id_kt_empty_modal" id="id_comment__{{ obj.pk }}" data-pk="{{ obj.pk }}" data-form_url="/core/micmod_base/quotationitem/{{ obj.comments.content_type.pk }}/{{ obj.pk }}">

                {% endif %}
            </div>
        {% endif %}
    {% endfor %}

    <div href="#" class="symbol symbol-35px symbol-circle" data-bs-toggle="modal" data-bs-target="#id_kt_empty_modal" id="id_comment__{{ obj.pk }}" data-pk="{{ obj.pk }}" data-form_url="/core/micmod_base/quotationitem/{{ obj.comments.content_type.pk }}/{{ obj.pk }}">
        <span class="symbol-label bg-dark text-gray-400 fs-8 fw-bold">+</span>
{#        <span>{{ unseen_comment_count }}</span>#}
    </div>
    <div class="badge badge-light-success mx-3 text-wrap fw-bolder"><span>{{ unseen_comment_count }}</span></div>
</div>
