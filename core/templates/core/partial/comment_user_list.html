<div class="symbol-group symbol-hover flex-nowrap">
    {% for comment_user in comment_users %}
        <div class="symbol symbol-35px symbol-circle" data-bs-toggle="tooltip" aria-label="Michael Eberon" data-bs-original-title="{{ comment_user.user.username }}" data-kt-initialized="1">
            <img alt="Pic" src="{{ comment_user.get_user_image }}">
        </div>
    {% endfor %}

    <a href="#" class="symbol symbol-35px symbol-circle" data-bs-toggle="modal" data-bs-target="#kt_modal_view_users">
        <span class="symbol-label bg-dark text-gray-400 fs-8 fw-bold">+42</span>
    </a>
</div>
