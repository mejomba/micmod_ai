<div class="symbol-group symbol-hover flex-nowrap">
    {% for comment_user in comment_users %}
        {% if forloop.counter <= 5 %}
            <div class="symbol symbol-35px symbol-circle" data-bs-toggle="tooltip" aria-label="Michael Eberon" data-bs-original-title="{{ comment_user.user.username }}" data-kt-initialized="1">
                <img alt="Pic" src="{{ comment_user }}" data-bs-toggle="modal" data-bs-target="#id_kt_empty_modal" id="id_comment__{{ obj.pk }}" data-pk="{{ obj.pk }}" data-form_url="/core/micmod_base/quotationitem/{{ obj.comments.content_type.pk }}/{{ obj.pk }}">
            </div>
        {% endif %}
    {% endfor %}

    <div href="#" class="symbol symbol-35px symbol-circle" data-bs-toggle="modal" data-bs-target="#id_kt_empty_modal" id="id_comment__{{ obj.pk }}" data-pk="{{ obj.pk }}" data-form_url="/core/micmod_base/quotationitem/{{ obj.comments.content_type.pk }}/{{ obj.pk }}">
        <span class="symbol-label bg-dark text-gray-400 fs-8 fw-bold">+42</span>
    </div>
</div>
