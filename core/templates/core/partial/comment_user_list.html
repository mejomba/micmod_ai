{% load more_tags %}
{% if not cancel %}
<div class="symbol-group symbol-hover flex-nowrap">
    {% for comment_info in comments_info %}
        {% if forloop.counter <= 5 %}
            <div id="id_comment_user_list" class="symbol symbol-{{ size|default_if_falsy:35 }}px symbol-circle" data-bs-toggle="tooltip" data-bs-original-title="{{ comment_info.1.username }}: {{ comment_info.0.comment_content|truncatechars:45 }}" data-bs-original-title="{{ comment_info.1.username }}" data-kt-initialized="1">
                    <img alt="Pic" class="{% if not comment_info.0.seen %}border border-success border-3{% endif %}" src="{{ comment_info.2 }}" data-bs-target="#id_kt_empty_modal" data-pk="{{ obj.pk }}" data-form_url="/core/{{ obj|app_label }}/{{ obj|model_name }}/{{ obj.comments.content_type.pk }}/{{ obj.pk }}">
            </div>
        {% endif %}
    {% endfor %}

{% if obj_rel %}
    <div href="#" class="symbol symbol-{{ size|default_if_falsy:35 }}px symbol-circle" data-bs-toggle="modal" data-comment_type="{{ comment_type }}" data-bs-target="#id_kt_empty_modal" id="id_comment__{{ obj.pk }}" data-pk="{{ obj.pk }}" data-form_url="/core/{{ obj|app_label }}/{{ obj|model_name }}/{{ obj.comments.content_type.pk }}/{{ obj.pk }}/" data-form_url_rel="{{ obj_rel|app_label }}/{{ obj_rel|model_name }}/{{ obj_rel.comments.content_type.pk }}/{{ obj_rel.pk }}">
        <span class="symbol-label border border-gray-400 bg-white text-gray-700 fs-1 fw-bold">
            <i class="ki-outline ki-messages fs-4"></i>
        </span>
    </div>
    {% else %}
    <div href="#" class="symbol symbol-{{ size|default_if_falsy:35 }}px symbol-circle" data-bs-toggle="modal" data-comment_type="{{ comment_type }}" data-bs-target="#id_kt_empty_modal" id="id_comment__{{ obj.pk }}" data-pk="{{ obj.pk }}" data-form_url="/core/{{ obj|app_label }}/{{ obj|model_name }}/{{ obj.comments.content_type.pk }}/{{ obj.pk }}/">
        <span class="symbol-label border border-gray-400 bg-white text-gray-700 fs-1 fw-bold">
            <i class="ki-outline ki-messages fs-4"></i>
        </span>
    </div>
{% endif %}
    <span class="badge badge-light-success mx-3 text-wrap fw-bolder">
        {{ unseen_comment_count }}
    </span>
</div>
{% else %}
<a href="#" class="btn btn-danger" data-comment_type="cancel" data-bs-toggle="modal" id="id_comment__{{ obj.pk }}" data-bs-target="#id_kt_empty_modal" data-pk="{{ obj.pk }}" data-form_url="/core/{{ obj|app_label }}/{{ obj|model_name }}/{{ obj.comments.content_type.pk }}/{{ obj.pk }}">
    کنسل / لغو کنسل
</a>
{% endif %}
