<style>
    table caption {
        caption-side: top;
    }
</style>
<div class="table-responsive">
    <table class="table table-bordered">
    <caption>{{ title }}</caption>
        <thead>
            <tr class="fw-bold fs-6 text-gray-800">
                <th data-key="row">ردیف</th>
                {% for th in rows.0.keys %}
                    <th data-key="{{ th }}">{{ th }}</th>
                {% endfor %}
            </tr>
        </thead>
        <tbody>
            {% for tr in rows.items %}
                <tr class="{% if forloop.counter0|divisibleby:'2' %} table-active {% endif %}">
                    <td class="text-start">{{ forloop.counter }}</td>
                    {% for td in tr.1.values %}
                        <td class="text-start">{{ td }}</td>
                    {% endfor %}
                </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
