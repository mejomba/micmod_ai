{% load core_tags %}
<section id="gallery" dir="ltr" class="w-100">
    <div class="container">
        <div class="bg-gray-300 text-primary bold text-center w-100 rounded-top-5 py-3 fs-1"
             data-key="{{ rma_title|default:'images' }}"> {{ rma_title|default:'images' }} </div>
        {% if rma_images or rma_files or 1 %}
            <div id="image-gallery"
                 class="w-100 bg-light rounded-bottom-5 {{ rma_body_class|default:'mh-800px scroll-y' }}">
                <div class="row row-cols-{{ rma_cols|default:'5' }}" id="image-wrapper">
                    {% for image in rma_images %}
                        <div class="text-center px-5 py-5 image">
                            <div class="img-wrapper card-rounded mw-100 border-gray-300 border">
                                <a href="{{ image.path.url }}"><img src="{{ image.path.url }}"
                                                                    class="img-responsive" alt={{ image.alt }}></a>
                                <div class="img-overlay">
                                    <i class="fa fa-plus-circle" aria-hidden="true"></i>
                                </div>
                            </div>
                        </div>
                    {% endfor %}
                </div><!-- End row -->
                <div class="d-flex border border-top" id="file-wrapper">
                    {% for file in sku.files.all %}
                        <div class="text-center py-5 pe-4">
                        <a href="{{ file.path.url }}" target="_blank" class="me-1" data-bs-toggle="tooltip" data-bs-placement="top" title="{{ file.name }}">
                                <i class="fas fs-2 fa-file icon-lg text-primary"></i>
                            </a>
                        </div>
                    {% endfor %}
                    {% for file in rma_files %}
                        <div class="text-center py-5 pe-4">
                        <a href="{{ file.path.url }}" target="_blank" class="me-1" data-bs-toggle="tooltip" data-bs-placement="top" title="{{ file.name }}">
                                <i class="fas fs-2 fa-file icon-lg"></i>
                            </a>
                        </div>
                    {% endfor %}
                </div><!-- End row -->
            </div><!-- End image gallery -->
        {% else %}
            <div class="py-10 fs-3x text-center w-100">
                {% include "core/partial/components/blank_data.html" %}
            </div>
        {% endif %}


    </div><!-- End container -->
</section>


<script>
    $.ajax({
        type: 'GET',
        url: `/extra_data/item/image_and_datasheet/${document.querySelector('#id_sku_c').value}/?view_name=get_image_and_datasheet&response_function=product_image_and_datasheet`,
        dataType: 'json',
        cache: false,
        processData: false,
        contentType: false,
        success: function (data) {
            debugger
            const image_wrapper = document.querySelector('#image-wrapper')
            const file_wrapper = document.querySelector('#file-wrapper')
            const res = data['res'];
            const images = res.images
            const datasheets = res.datasheets

            images.forEach(function (item){
                const div = document.createElement('div');
                div.innerHTML = `
                    <div class="text-center px-5 py-5 image">
                        <div class="img-wrapper card-rounded mw-100 border-gray-300 border">
                            <a href="http://192.168.1.73:1010/${ item }"><img src="http://192.168.1.73:1010/${ item }"
                                class="img-responsive" alt=""></a>
                            <div class="img-overlay">
                                <i class="fa fa-plus-circle" aria-hidden="true"></i>
                            </div>
                        </div>
                    </div>
                `.trim();

                image_wrapper.appendChild(div.firstElementChild);
                }
            )

            datasheets.forEach(function (item){
                const div = document.createElement('div');
                div.innerHTML = `
                    <div class="text-center py-5 pe-4">
                        <a href="http://192.168.1.73:1010${ item }" target="_blank" class="me-1"
                           data-bs-toggle="tooltip" data-bs-placement="top" title="${item}">
                            <i class="fas fs-2 fa-file icon-lg text-primary"></i>
                        </a>
                    </div>
                `.trim();

                file_wrapper.prepend(div.firstElementChild);
            })

        },
        error: function () {},
    });
</script>
