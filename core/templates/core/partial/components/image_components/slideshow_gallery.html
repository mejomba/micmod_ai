{% load core_tags %}
<section id="gallery" dir="ltr" class="w-100">
    <div class="container">
        <div class="bg-gray-300 text-primary bold text-center w-100 rounded-top-5 py-3 fs-1"
             data-key="{{ rma_title|default:'images' }}"> {{ rma_title|default:'images' }} </div>
        {% if rma_images %}
            <div id="image-gallery"
                 class="w-100 bg-light rounded-bottom-5 {{ rma_body_class|default:'mh-800px scroll-y' }}">
                <div class="row row-cols-{{ rma_cols|default:'5' }}">
                    {% for image in rma_images %}
                        <div class="text-center px-5 py-5 image">
                            <div class="img-wrapper card-rounded mw-100 border-gray-300 border">
                                <a href="{{ image.path.url }}"><img src="{{ image.path.url }}"
                                                                    class="img-responsive" alt={{ image.alt }}></a>
                                <div class="img-overlay">
                                    <i class="fa fa-plus-circle" aria-hidden="true"></i>
                                </div>
                            </div>
                        </div>
                    {% endfor %}
                </div><!-- End row -->
            </div><!-- End image gallery -->
        {% else %}
            <div class="py-10 fs-3x text-center w-100">
                {% include "core/partial/components/blank_data.html" %}
            </div>
        {% endif %}
    </div><!-- End container -->
</section>
