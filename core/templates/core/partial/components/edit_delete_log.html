{% load more_tags %}
<div class="col-3">
    <span>
        <a href="#" target="_blank" id="" class="me-3 edit-customer-expert tooltip_" data-url={{ edit_url }} data-bs-toggle="modal" data-bs-target="#id_kt_empty_modal_lg">
            <span class="tooltiptext">ویرایش</span>
            <i class="ki-duotone ki-pencil fs-2 text-info">
             <span class="path1"></span>
             <span class="path2"></span>
        </i>
        </a>
        <a href="#" target="_blank" class="me-2 delete-customer-expert text-danger tooltip_" data-url=/core/delete/?model={{ obj|model_name }}&object_id={{ obj.pk }}&app_label={{ obj|app_label }}" data-bs-toggle="modal" data-bs-target="#id_kt_empty_modal_sm">
            <span class="tooltiptext">حذف</span>
            <i class="ki-duotone ki-trash fs-2 text-danger">
                <span class="path1"></span>
                <span class="path2"></span>
                <span class="path3"></span>
                <span class="path4"></span>
                <span class="path5"></span>
            </i>
        </a>
        <a class="mx-3 p-1 cursor-pointer tooltip_"
            data-bs-toggle="modal"
            data-bs-target="#id_kt_empty_modal_lg"
            data-model_name="{{ obj|model_name }}"
            data-object_id="{{ obj.pk }}"
            data-app_name="{{ obj|app_label }}"
            name="name_change_log">
            <span class="tooltiptext">تاریخچه تغییرات</span>
            <i class="ki-duotone ki-book-open fs-2 text-primary">
                <span class="path1"></span>
                <span class="path2"></span>
                <span class="path3"></span>
                <span class="path4"></span>
            </i>
        </a>
    </span>
</div>
