<a href="" class="btn btn-success d-none" target="_blank" id="download-excel">دانلود اکسل</a>

<script>
    setTimeout(function imei_excel(){
        const datatable = document.querySelector('.datatable-column-filter-row')
        const datatable_input = datatable.querySelectorAll('input')
        datatable_input.forEach(function (item){
            item.addEventListener('keydown', function (e) {
                console.log('key: ', e.currentTarget)
            })
        })
        const DownloadExcel = document.getElementById('download-excel');
        let url = new URL('http://127.0.0.1:8000/core/excel/download/')
        let params = [['model_name', "{{ model_name }}"], ['header', "{{ header }}"], ['app_label', "{{ app_label }}"]]

        url.search = new URLSearchParams(params).toString();
        DownloadExcel.href = url
        DownloadExcel.addEventListener('click', function (e) {
            console.log('set loader for download')
        })
    }, 2000)


</script>
