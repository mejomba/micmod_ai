{% load core_tags %}
{% load static %}
<table class="table table-striped" dir="rtl">
  {% if transpose %}
    {#    To do#}
  {% else %}
    {% if header %}
    <tr>
        {% for col in data_frame.columns %}
            <td data-key="{{ coll }}">{{ col }}</td>
        {% endfor %}
    </tr>
    {% endif %}
    {% for row in data_frame.values %}
        <tr>
        {% for col in row %}
            <td>{{ col|humanized_format }}</td>
        {% endfor %}
        </tr>
    {% endfor %}
  {% endif %}
</table>
<script src="{% static 'lang/translate.js' %}"></script>
