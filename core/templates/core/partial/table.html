<table class="table table-striped">
    {% if header %}
    <tr>
        {% for col in data_frame.columns %}
            <td data-key="{{ coll }}">{{ col }}</td>
        {% endfor %}
    </tr>
    {% endif %}
    {% for row in data_frame.values %}
        <tr>
        {% for col in row %}
            <td>{{ col }}</td>
        {% endfor %}
        </tr>
    {% endfor %}
</table>
