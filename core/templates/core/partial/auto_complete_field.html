{% load  sekizai_tags %}
{% load static %}
{% load core_tags %}
{% addtoblock "custom_css" %}
    <link rel="stylesheet" type="text/css" href="{% static 'custom_libs/vendors.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'custom_libs/selectize/selectize.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'custom_libs/selectize/selectize.default.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'custom_libs/selectize/form-selectize.css' %}">
{% endaddtoblock %}
{{ field.field.widget.attrs.source }}
<div class="form-group" id="div_{{ field.name }}">
    <select class="selectize-select" name="{{ field.name }}">
        <option value="" selected></option>
        {% get_list field as items_list %}
        {% for item in items_list %}
        <option value="{{ item }}" selected>{{ item }}</option>
        {% endfor %}
    </select>
</div>
{% addtoblock "custom_js" %}
    <script src="{% static 'custom_libs/vendors.min.js' %}" type="text/javascript"></script>
    <script src="{% static 'custom_libs/selectize/selectize.min.js' %}" type="text/javascript"></script>
    <script src="{% static 'custom_libs/selectize/form-selectize.js' %}" type="text/javascript"></script>
{% endaddtoblock %}
